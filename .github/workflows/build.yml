name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Solution/AowEmailWrapper.sln -c Release

      - name: Test
        run: dotnet test Solution/AowEmailWrapper.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File Installer/build-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AowEmailWrapper-setup
          path: publish/AowEmailWrapper-*-setup.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'

      # Every commit on master becomes a pre-release with the installer attached. The Wrapper's
      # update check (Helpers/UpdateHelper.cs) reads the newest release, compares its commit with
      # the one stamped into the running executable and offers the installer.
      - name: Publish build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./Installer/publish-release.ps1
